name: Redesign safe checks

on:
  push:
    branches: [redesign]
  pull_request:
    branches: [redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check company-code validation
        run: node tests/company-code.test.mjs
      - name: Check E2E launch regressions
        run: node tests/e2e-launch-fixes.test.mjs
      - name: Check administrator session handling
        run: node --experimental-vm-modules tests/impersonation.test.mjs
      - name: Production bundle with no live credentials
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: npm run build

      - name: Check hire host and legacy routes
        run: node tests/hire-routes.test.mjs
      - name: Check hire message requests and validation
        run: node tests/hire-messages.test.mjs
      - name: Check current-plan validity display
        run: node tests/plan-validity.test.mjs
      - name: Check Business Pro ad quota display
        run: node tests/ad-quota.test.mjs
      - name: Check proposed Business Pro quota in synthetic local PostgreSQL
        run: node tests/ad-quota-sql.test.mjs
      - name: Check hire message SQL with synthetic local PostgreSQL fixtures
        run: node tests/hire-messages-sql.test.mjs
      - name: Independent hire bundle with no live credentials
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build:hire
      - name: Check public job links and safe authentication return paths
        run: node tests/public-job-ads.test.mjs
      - name: Check public job access and application rules in synthetic PostgreSQL
        run: node tests/public-job-ads-sql.test.mjs
