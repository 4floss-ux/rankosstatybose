name: Real-account QA login browser smoke
on:
  push:
    branches: [fix/job-ad-delete-retire-close-20261105]
    paths: [".github/workflows/e2e-browser-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser driver
        shell: bash
        run: |
          set -e
          google-chrome --version || chromium --version || true
          mkdir -p /tmp/statybos24-browser
          cd /tmp/statybos24-browser
          npm init -y >/dev/null
          npm install playwright --no-audit --no-fund
      - name: Verify real login gate appears in Chromium
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "/tmp/statybos24-browser/node_modules/playwright/index.mjs";
          const browser = await chromium.launch({
            headless:true,
            channel:"chrome",
            args:["--no-sandbox"]
          });
          try {
            const page = await browser.newPage({viewport:{width:1365,height:900}});
            const errors=[];
            const failed=[];
            page.on("pageerror",e=>errors.push(e.message));
            page.on("console",e=> {if(e.type()==="error")errors.push("console: "+e.text());});
            page.on("requestfailed",r=>failed.push(r.url()+" -> "+r.failure()?.errorText));
            page.on("response",r=>{if(r.status()>=400)failed.push(r.status()+" "+r.url());});
            const response = await page.goto("https://wpldojonwvccdmpmlbfe.supabase.co/functions/v1/e2e-site/",
              {waitUntil:"domcontentloaded",timeout:45000});
            if(response?.status()!==200)throw Error("HTML response: "+response?.status());
            console.log("HTTP RESP HEADERS:",JSON.stringify(response?.headers()));
            console.log("DOCUMENT INITIAL HTML:",(await page.content()).slice(0,550));
            await page.waitForTimeout(5500);
            console.log("DOCUMENT TITLE:",await page.title());
            console.log("BODY TEXT:",(await page.locator("body").innerText()).slice(0,1500));
            console.log("FAILED REQUESTS:",JSON.stringify(failed.slice(0,20)));
            console.log("PAGE ERRORS:",JSON.stringify(errors.slice(0,20)));
            await page.screenshot({path:"/tmp/statybos24-qa-login.png",fullPage:true});
            await page.locator('input[type="email"]').waitFor({state:"visible",timeout:6000});
            await page.locator('input[type="password"]').waitFor({state:"visible",timeout:5000});
            const body=(await page.locator("body").innerText()).slice(0,1000);
            if(!body.includes("Statybos24")||!body.includes("Prisijunk savo Statybos24 paskyra"))throw Error("QA access gate missing");
            if(errors.length)throw Error("Browser runtime errors: "+errors.join(" | "));
            await page.screenshot({path:"/tmp/statybos24-qa-login.png",fullPage:true});
            console.log("PASS: Headless Chromium renders isolated owner login.");
            console.log("Login form visible, no runtime JS errors.");
          } finally {await browser.close();}
          NODE
      - name: Save private staging screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-login-screen
          path: /tmp/statybos24-qa-login.png
          if-no-files-found: ignore
