name: Check QA Cloudflare deployment credentials (no deploy)
on:
  push:
    branches: ["fix/job-ad-delete-retire-close-20261105"]
    paths:
      - ".github/workflows/e2e-hosting-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CF_TOKEN_SET: ${{ secrets.CF_API_TOKEN != '' }}
      CF_ACCOUNT_SET: ${{ secrets.CF_ACCOUNT_ID != '' }}
    steps:
      - name: Verify required credential availability without logging values
        shell: bash
        run: |
          echo "Cloudflare API token present: ${CLOUDFLARE_TOKEN_SET}"
          echo "Cloudflare account ID present: ${CLOUDFLARE_ACCOUNT_SET}"
          echo "Alternate Cloudflare token present: ${CF_TOKEN_SET}"
          echo "Alternate Cloudflare account ID present: ${CF_ACCOUNT_SET}"
          if [[ "${CLOUDFLARE_TOKEN_SET}" != "true" && "${CF_TOKEN_SET}" != "true" ]]; then
            echo "::error::No Cloudflare deploy credential is configured in GitHub Actions."
            exit 1
          fi
          if [[ "${CLOUDFLARE_ACCOUNT_SET}" != "true" && "${CF_ACCOUNT_SET}" != "true" ]]; then
            echo "::error::No Cloudflare account ID is configured in GitHub Actions."
            exit 1
          fi
          echo "Credentials exist. No changes were deployed."
