name: Temporary colors-only verification (no deploy)
on:
  push:
    branches:
      - design/colors-only-1c1410-ffb020-20261107
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_PUBLISHABLE_KEY: ""
      VITE_SUPABASE_ANON_KEY: ""
      SENTRY_AUTH_TOKEN: ""
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without credentials
        run: npm install --no-audit --no-fund
      - name: Company code validation
        run: node tests/company-code.test.mjs
      - name: E2E launch regression checks
        run: node tests/e2e-launch-fixes.test.mjs
      - name: Admin session regression checks
        run: node --experimental-vm-modules tests/impersonation.test.mjs
      - name: Verify palette and selectors are present
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p24 = fs.readFileSync('src/p24/p24.css','utf8');
          const shell = fs.readFileSync('src/ui/appShell.jsx','utf8');
          const root = fs.readFileSync('src/styles.css','utf8');
          assert.match(p24,/--nav-bg:#1C1410/);
          assert.match(p24,/--orange:#FFB020/);
          assert.match(p24,/--focus:#B57300/);
          assert.match(p24,/--green:#15803D/);
          assert.match(p24,/--red:#B91C1C/);
          assert.match(p24,/--blue:#1D4ED8/);
          assert.match(p24,/--warning:#A65D00/);
          assert.match(p24,/--cta-gradient:linear-gradient\(100deg, #E18E13 0%, #FFB020 100%\)/);
          assert.match(p24,/\.p24 \.item\[aria-current="page"\]\{background:var\(--orange\);color:var\(--nav-bg\)\}/);
          assert.match(p24,/\.p24 \.wd-accept\{background:var\(--green\)!important/);
          assert.match(root,/--nav-bg:#1C1410/);
          assert.match(shell,/--s24-navy:#1C1410/);
          console.log('Colors-only selector and token assertions passed');
          NODE
      - name: Production build with no live credentials or deployment
        run: npm run build

      - name: Prepare original version at the recorded baseline commit
        shell: bash
        run: |
          git worktree add --detach /tmp/statybos24-colors-original ffb5219447412c142a3ae6ed59e64d26dabb6aaa
          cd /tmp/statybos24-colors-original
          npm install --no-audit --no-fund
          npm run build
      - name: Browser geometry and desktop/mobile screenshots (read-only)
        shell: bash
        run: |
          mkdir -p /tmp/s24-browser /tmp/s24-colors-screens
          cd /tmp/s24-browser
          npm init -y >/dev/null
          npm install playwright --no-audit --no-fund >/dev/null
          google-chrome --version
          cd "$GITHUB_WORKSPACE"
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/s24-new.log 2>&1) &
          (cd /tmp/statybos24-colors-original && npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/s24-before.log 2>&1) &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          import { chromium } from '/tmp/s24-browser/node_modules/playwright/index.mjs';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const browser = await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          const selectors = [
            '.p24 .lp-top','.p24 .lp-hero','.p24 .lp-hero-in',
            '.p24 .lp-hero h1','.p24 .lp-cta','.p24 .lp-proof',
            '.p24 .lp-phone','.p24 .lp-sec','.p24 .lp-card',
            '.p24 .btn.primary','.p24 .h-hero','.p24 .h-hero h1',
            '.p24 .h-hero-in','.p24 .h-route','.p24 .h-top'
          ];
          async function capture(port, route, width, height, label) {
            const context = await browser.newContext({
              viewport:{width,height}, deviceScaleFactor:1, serviceWorkers:'block'
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror',e=>errors.push(e.message));
            const response = await page.goto('http://127.0.0.1:'+port+route,{waitUntil:'domcontentloaded',timeout:30000});
            assert.equal(response?.status(),200, label+' HTTP response');
            await page.locator(route==='/hire'?'.p24 .h-hero':'.p24 .lp-hero').waitFor({state:'visible',timeout:30000});
            await page.evaluate(()=>document.fonts?.ready);
            await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;}'});
            await page.waitForTimeout(450);
            const result=await page.evaluate(selectors=>{
              const geometry={};
              for(const s of selectors){
                const el=document.querySelector(s);
                if(!el)continue;
                const r=el.getBoundingClientRect();
                geometry[s]=Object.fromEntries(['x','y','width','height'].map(k=>[k,Math.round(r[k]*10)/10]));
              }
              const hero=document.querySelector('.p24 .lp-hero');
              const primary=document.querySelector('.p24 .btn.primary');
              const nav=document.querySelector('.p24');
              return {
                geometry,
                colors:{
                  navToken:nav?getComputedStyle(nav).getPropertyValue('--nav-bg').trim():null,
                  accentToken:nav?getComputedStyle(nav).getPropertyValue('--orange').trim():null,
                  heroBackground:hero?getComputedStyle(hero).backgroundColor:null,
                  ctaBackground:primary?getComputedStyle(primary).backgroundImage:null,
                  ctaText:primary?getComputedStyle(primary).color:null,
                },
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth
              };
            },selectors);
            assert.equal(errors.length,0,label+' JS errors: '+errors.join('; '));
            await page.screenshot({path:'/tmp/s24-colors-screens/'+label+'.png',fullPage:false});
            if(port===4173 && route==='/'){
              assert.equal(result.colors.navToken,'#1C1410');
              assert.equal(result.colors.accentToken,'#FFB020');
              assert.equal(result.colors.heroBackground,'rgb(28, 20, 16)');
              assert.match(result.colors.ctaBackground||'',/rgb\(225, 142, 19\)/);
              assert.equal(result.colors.ctaText,'rgb(28, 20, 16)');
            }
            await context.close();
            return result;
          }
          try{
            const summary=[];
            for(const [route,key] of [['/','home'],['/hire','hire']]){
              for(const [width,height,device] of [[1440,900,'desktop'],[390,844,'mobile']]){
                const old=await capture(4174,route,width,height,'before-'+key+'-'+device);
                const now=await capture(4173,route,width,height,'after-'+key+'-'+device);
                const all=Object.keys(old.geometry);
                let max=0;
                const differences=[];
                for(const s of all){
                  assert.ok(now.geometry[s],key+' '+device+' selector missing after: '+s);
                  for(const k of ['x','y','width','height']){
                    const diff=Math.abs(old.geometry[s][k]-now.geometry[s][k]);
                    if(diff>max)max=diff;
                    if(diff>2)differences.push(s+' '+k+' '+diff);
                  }
                }
                assert.equal(differences.length,0,key+' '+device+' geometry changed: '+differences.join('; '));
                console.log(key,device,'PASS',all.length,'selectors; max delta',max,'px');
                summary.push({route,device,selectors:all.length,maxDelta:max,overflowBefore:old.overflow,overflowAfter:now.overflow,colors:now.colors});
              }
            }
            fs.writeFileSync('/tmp/s24-colors-screens/geometry.json',JSON.stringify(summary,null,2));
            console.log('Browser geometry comparison complete, visual screenshots saved.');
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colors-only-before-after-desktop-mobile
          path: /tmp/s24-colors-screens/
          if-no-files-found: ignore
