name: Live maintenance gate (read only)

on:
  pull_request:
    branches: [redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify production is closed before changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://statybos24.lt'
          def check(path):
              req = urllib.request.Request(base + path,
                  headers={'User-Agent':'Statybos24-release-safety-probe/1.0',
                           'Accept':'application/json, text/html'},
                  method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.read(2000).decode('utf-8', 'replace')
              except urllib.error.HTTPError as error:
                  return error.code, error.read(2000).decode('utf-8','replace')

          try:
              status, status_body = check('/api/status')
              home, home_body = check('/')
              data = json.loads(status_body) if status == 200 else {}
              maintenance = data.get('maintenance')
              print('Live /api/status HTTP:',status)
              print('Live / HTTP:',home)
              print('Live maintenance active:',maintenance)
              if status != 200 or maintenance is not True or home != 503:
                  print('::error::Production must be in maintenance mode and return 503 to anonymous visits.')
                  raise SystemExit(1)
              print('PASS: Production is protected by live maintenance mode.')
              print('NOTE: Only unauthenticated GET probes; this does not verify build or login.')
          except Exception as exc:
              print(f'::error::{type(exc).__name__}: {exc}')
              raise SystemExit(1)
          PY
