name: Dashboard build check

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "worker.staging.js"
      - "wrangler.staging.jsonc"
      - "staging.test.js"
      - ".github/workflows/**"
      - "vite.config.js"
  push:
    branches:
      - "design/prisijungusiu-valdymas-2026-10"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify production bundle builds
        run: npm run build
      - name: Verify staging isolation
        run: node --test staging.test.js
      - name: Verify staging bundle builds
        run: npm run build:staging
