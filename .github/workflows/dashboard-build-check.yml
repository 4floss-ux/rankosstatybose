name: Dashboard build check

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.js"
  push:
    branches:
      - "design/prisijungusiu-valdymas-2026-10"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify production bundle builds
        run: npm run build
