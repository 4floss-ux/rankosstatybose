name: Verify deployed Statybos24 QA login in browser
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e-pages-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test browser tooling
        shell: bash
        run: |
          mkdir -p /tmp/qa-check
          cd /tmp/qa-check
          npm init -y >/dev/null
          npm install playwright --no-audit --no-fund >/dev/null
          google-chrome --version
      - name: Verify test login and deny unauthorized visitors
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from "/tmp/qa-check/node_modules/playwright/index.mjs";
          const browser=await chromium.launch({channel:"chrome",headless:true,args:["--no-sandbox"]});
          try{
            const page=await browser.newPage({viewport:{width:1320,height:900}});
            const errors=[],failed=[],consoleErrors=[];
            page.on("pageerror",e=>errors.push(e.message));
            page.on("console",e=>{if(e.type()==="error")consoleErrors.push(e.text())});
            page.on("response",r=>{if(r.status()>=400)failed.push(r.status()+" "+r.url().slice(0,180))});
            let status=0;
            for(let attempt=0;attempt<8;attempt++){
              try{
                const response=await page.goto("https://4floss-ux.github.io/rankosstatybose/",{
                  waitUntil:"domcontentloaded",timeout:12000
                });
                status=response?.status()||0;
                if(status===200)break;
              }catch(e){console.log("Attempt",attempt+1,"navigation pending:",e.message.slice(0,160))}
              await page.waitForTimeout(3500);
            }
            console.log("Pages HTTP status",status);
            if(status!==200)throw Error("GitHub Pages test site not live: "+status);
            await page.locator('input[type="email"]').waitFor({state:"visible",timeout:20000}).catch(async e=>{
              console.log("BODY:",(await page.locator("body").innerText()).slice(0,1600));
              console.log("PAGE ERRORS",JSON.stringify(errors));
              console.log("FAILED REQUESTS",JSON.stringify(failed.slice(0,20)));
              throw e;
            });
            await page.locator('input[type="password"]').waitFor({state:"visible",timeout:5000});
            if(await page.getByText("Pasirink, kuo nori būti").count())throw Error("Unauthorized visitor saw role switcher");
            const aId=await page.evaluate(()=>sessionStorage.getItem("statybos24-e2e-tab-id-v1"));
            if(!aId)throw Error("QA per-tab auth storage not initialized");
            const second=await page.context().newPage();
            await second.goto("https://4floss-ux.github.io/rankosstatybose/",{waitUntil:"domcontentloaded"});
            await second.locator('input[type="email"]').waitFor({state:"visible",timeout:20000});
            const bId=await second.evaluate(()=>sessionStorage.getItem("statybos24-e2e-tab-id-v1"));
            if(!bId || aId===bId)throw Error("QA browser tabs share the same auth storage identifier");
            await page.reload({waitUntil:"domcontentloaded"});
            const afterReload=await page.evaluate(()=>sessionStorage.getItem("statybos24-e2e-tab-id-v1"));
            if(afterReload!==aId)throw Error("QA session is not persistent on refresh");
            await second.close();
            console.log("PASS: Two independent QA tab auth stores; reload preserves tab identity.");
            console.log("PASS: Private login form is visible and actor switching is gated.");
            console.log("JS RUNTIME ERRORS:",JSON.stringify(errors.slice(0,8)));
            console.log("FAILED REQUESTS:",JSON.stringify(failed.slice(-12)));
            console.log("CONSOLE ERRORS:",JSON.stringify(consoleErrors.slice(-12)));
            if(errors.length)throw Error("Uncaught JS runtime exceptions.");
            await page.screenshot({path:"/tmp/qa-login.png",fullPage:true});
          }finally{await browser.close();}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statybos24-qa-login-browser-screenshot
          path: /tmp/qa-login.png
          if-no-files-found: ignore
